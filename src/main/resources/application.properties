# The name of the Spring Boot application
spring.application.name=my-project
# Load local .env file as properties when present
spring.config.import=optional:file:.env[.properties]
# Database Properties
# Database connection URL for PostgreSQL
spring.datasource.url=${DB_URL}
# Database username for authentication
spring.datasource.username=${DB_USERNAME}

# Database password for authentication
spring.datasource.password=${DB_PASSWORD}


# The driver class name for PostgreSQL database
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate Properties
# Hibernate setting to automatically update the database schema
spring.jpa.hibernate.ddl-auto=update

# Hibernate dialect for PostgreSQL, used to generate SQL optimized for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Never put a stack trace in an HTTP response: it leaks class names, library
# versions and internal paths. Spring Boot already defaults to `never`, but
# spring-boot-devtools flips it to `always` in development, so dev responses
# would otherwise look nothing like production ones.
server.error.include-stacktrace=never
